name: Test, Build and Deploy with MicroK8s

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-analyze:
    name: Tests + SonarQube
    runs-on: ubuntu-latest
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Sonar usa el historial completo para el blame y para detectar
          # código nuevo; con un clon superficial lo marca todo como nuevo.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # Los tests no tocan PostgreSQL: el contexto de Spring usa H2 en memoria
      # (src/test/resources/application.properties).
      #
      # `verify` y `sonar:sonar` van juntos: sin `verify` no hay informe de
      # JaCoCo y Sonar reporta 0% de cobertura. El servidor y la clave del
      # proyecto están en el pom; solo se pasa el token.
      #
      # El Quality Gate no bloquea el pipeline: mientras exista
      # ReporteClaseService (defectos a propósito) estará en Failed.
      - name: Tests + análisis
        if: env.SONAR_TOKEN != ''
        run: ./mvnw -B clean verify sonar:sonar -Dsonar.token=$SONAR_TOKEN

      # Sin token (PR desde un fork, o secret aún no creado) se corren solo los tests.
      - name: Tests sin análisis
        if: env.SONAR_TOKEN == ''
        run: ./mvnw -B clean verify

  build-and-publish:
    name: Build and Push Image to GHCR
    runs-on: ubuntu-latest
    needs: test-and-analyze
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # GHCR exige el nombre en minúsculas: ghcr.io/docsjaveriana/ex-estudiante
      - name: Set IMAGE
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t ${IMAGE}:latest -t ${IMAGE}:${GITHUB_SHA::7} .

      - name: Push Docker image
        run: |
          docker push ${IMAGE}:latest
          docker push ${IMAGE}:${GITHUB_SHA::7}

      - name: Print pushed image URL
        run: 'echo "Imagen publicada: ${IMAGE}:latest (${GITHUB_SHA::7})"'

  deploy-onpremise:
    name: Deploy on MicroK8s On-Premise
    runs-on: self-hosted
    needs: build-and-publish
    if: github.event_name == 'push'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      # El secret estudiante-secret (DB_PASSWORD) no se crea aquí: se crea una
      # sola vez en el nodo con k8s/dev/create-secrets.sh.
      - name: Apply Kubernetes deployment
        run: sudo microk8s kubectl apply -f k8s/dev/deployment.yaml

      # La imagen siempre es :latest, así que `apply` no detecta cambios en el
      # Deployment; el restart fuerza a bajar la nueva (imagePullPolicy: Always).
      - name: Restart Kubernetes deployment
        run: sudo microk8s kubectl rollout restart deployment/estudiante -n estudiante

      - name: Wait for rollout
        run: sudo microk8s kubectl rollout status deployment/estudiante -n estudiante --timeout=5m
