spring.application.name=estudiante

# --- PostgreSQL ---
# Cada valor se puede sobrescribir con su variable de entorno; si no está definida,
# se usa el valor por defecto (el servidor del curso).
spring.datasource.url=jdbc:postgresql://${DB_HOST:190.146.2.119}:${DB_PORT:2345}/${DB_NAME:estudiante}
spring.datasource.username=${DB_USER:estudiante}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
