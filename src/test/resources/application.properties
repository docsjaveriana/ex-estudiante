# Configuración exclusiva de pruebas: base H2 en memoria, para que el contexto de
# Spring cargue sin depender del PostgreSQL del curso ni de la variable DB_PASSWORD.
spring.datasource.url=jdbc:h2:mem:estudiante;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Este archivo reemplaza por completo al de src/main: las rutas de springdoc se
# repiten aquí y deben coincidir con las de producción.
springdoc.api-docs.path=/api/estudiante/v3/api-docs
springdoc.swagger-ui.path=/api/estudiante/swagger-ui.html
springdoc.paths-to-match=/api/estudiante/**

# --- CORS ---
# Orígenes que pueden llamar a la API (separados por coma). Por defecto, cualquiera.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
